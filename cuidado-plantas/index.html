/* =====================================================================
   Avisos en el celular (notificaciones push). La app guarda su suscripción
   en la función netlify/functions/avisos.mjs junto con las fechas de riego,
   abono y fotos de control, y avisos-diarios.mjs revisa cada hora a quién
   le toca un aviso. La configuración es de cada celular: no va en el respaldo.
   ===================================================================== */
const AVISOS_URL = '/.netlify/functions/avisos';
const AVISOS_KEY = 'brote.avisos';
const AVISOS_HORAS = Array.from({length:16}, (_, i) => i + 7);   // de 7 a 22 h
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const tzName = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Argentina/Buenos_Aires'; } catch { return 'America/Argentina/Buenos_Aires'; } };
const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, reject) => setTimeout(() => reject(new Error(msg)), ms))]);

function avisosCfg(){
  let c = null;
  try { c = JSON.parse(localStorage.getItem(AVISOS_KEY)); } catch {}
  if (!c || typeof c !== 'object') c = {};
  return {
    on: c.on === true,
    hora: Number.isInteger(c.hora) && c.hora >= 0 && c.hora <= 23 ? c.hora : 9,
    id: typeof c.id === 'string' && /^[A-Za-z0-9_-]{20,64}$/.test(c.id) ? c.id : '',
    endpoint: typeof c.endpoint === 'string' ? c.endpoint : '',
    sent: typeof c.sent === 'string' ? c.sent : '',   // huella del último plan que recibió el servidor
    nudge: c.nudge !== false,
  };
}
function setAvisosCfg(patch){
  const c = {...avisosCfg(), ...patch};
  try { localStorage.setItem(AVISOS_KEY, JSON.stringify(c)); } catch {}
  return c;
}
// Identificador al azar de este celular: el servidor solo guarda su hash.
function deviceId(){
  const c = avisosCfg();
  if (c.id) return c.id;
  const bytes = crypto.getRandomValues(new Uint8Array(24));
  const id = btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  setAvisosCfg({id});
  return id;
}
function avisosState(){
  if (!servedOnline()) return 'archivo';
  if (isIOS() && !isInstalled()) return 'instalar';
  if (!pushSupported()) return 'no-soportado';
  if (Notification.permission === 'denied') return 'bloqueado';
  return avisosCfg().on && Notification.permission === 'granted' ? 'activo' : 'apagado';
}
// Qué planta necesita qué y cuándo, con lo más urgente primero.
function avisosPlan(){
  const plan = [];
  for (const p of state.plants){
    const n = p.name.slice(0, 60);
    plan.push({n, t:'riego', d:nextWater(p)});
    const f = nextFert(p);
    if (f) plan.push({n, t:'abono', d:f});
    const r = nextReview(p);
    if (r) plan.push({n, t:'revision', d:r});
  }
  return plan.sort((a, b) => a.d.localeCompare(b.d) || TASK_ORDER[a.t] - TASK_ORDER[b.t]).slice(0, 300);
}
function hashStr(s){ let h = 0x811c9dc5; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }
const planSig = (plan, hora) => hashStr(JSON.stringify([hora, tzName(), plan]));

async function avisosPost(body, keepalive = false){
  const headers = {'Content-Type':'application/json'};
  if (APP_TOKEN) headers['x-app-token'] = APP_TOKEN;
  let res;
  try { res = await fetch(AVISOS_URL, {method:'POST', headers, body:JSON.stringify(body), keepalive}); }
  catch { throw Object.assign(new Error('No hay conexión. Revisá tu internet y probá de nuevo.'), {code:'sin_conexion'}); }
  const data = await res.json().catch(() => null);
  if (res.ok && data) return data;
  const err = new Error(data && data.error ? data.error
    : res.status === 404 ? 'No se encontró el servicio de avisos. ¿Está publicada la función en Netlify?'
    : `No se pudo completar (error ${res.status}). Probá de nuevo.`);
  err.code = (data && data.code) || `http_${res.status}`;
  throw err;
}
let swReady = null;
function registerSW(){
  if (!('serviceWorker' in navigator) || !servedOnline()) return Promise.reject(new Error('Este navegador no permite avisos.'));
  return swReady ||= navigator.serviceWorker.register('sw.js')
    .then(() => withTimeout(navigator.serviceWorker.ready, 15000, 'El celular tardó demasiado en preparar los avisos. Probá de nuevo.'))
    .catch(e => { swReady = null; throw e; });
}
async function vapidKey(){
  if (ui.vapid) return ui.vapid;
  const data = await avisosPost({accion:'clave'});
  if (typeof data.publicKey !== 'string' || !data.publicKey) throw new Error('El servidor no devolvió la clave de los avisos.');
  return ui.vapid = data.publicKey;
}
function b64urlBytes(s){
  const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));
  return Uint8Array.from(b, ch => ch.charCodeAt(0));
}
function sameKey(sub, key){
  const k = sub.options && sub.options.applicationServerKey;
  if (!k) return true;   // el navegador no la informa: se asume que es la misma
  const a = new Uint8Array(k), b = b64urlBytes(key);
  return a.length === b.length && a.every((x, i) => x === b[i]);
}
async function saveSubscription(sub){
  const c = avisosCfg(), plan = avisosPlan();
  await avisosPost({accion:'guardar', id:deviceId(), subscription:sub.toJSON(), plan, hora:c.hora, tz:tzName()});
  setAvisosCfg({on:true, endpoint:sub.endpoint, sent:planSig(plan, c.hora)});
}
// Si el servidor perdió la suscripción, la vuelve a guardar (si el celular todavía la tiene).
async function repairSubscription(){
  try {
    const reg = await registerSW();
    const sub = await reg.pushManager.getSubscription();
    if (!sub){ setAvisosCfg({on:false, endpoint:'', sent:''}); return false; }
    await saveSubscription(sub);
    return true;
  } catch (e) { console.warn(e); return false; }
}

async function enableAvisos(){
  if (ui.avisosBusy || !pushSupported()) return;
  // En iPhone el permiso se pide en el mismo toque del botón, antes de cualquier espera.
  const permiso = Notification.permission === 'granted' ? Promise.resolve('granted') : Notification.requestPermission();
  ui.avisosBusy = true;
  renderAvisos();
  try {
    const perm = await permiso;
    if (perm !== 'granted'){
      toast(perm === 'denied' ? 'Bloqueaste los avisos. Si cambiás de idea, habilitalos en los ajustes del celular.' : 'No se activaron los avisos.');
      return;
    }
    const reg = await registerSW();
    const key = await vapidKey();
    let sub = await reg.pushManager.getSubscription();
    if (sub && !sameKey(sub, key)){ await sub.unsubscribe().catch(() => {}); sub = null; }
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64urlBytes(key)});
    await saveSubscription(sub);
    toast('🔔 ¡Listo! Te vamos a avisar cuando una planta necesite algo.');
  } catch (e) {
    console.warn(e);
    toast(e.code ? e.message : 'No se pudieron activar los avisos. Probá de nuevo en un rato.');
  } finally {
    ui.avisosBusy = false;
    renderAvisos();
  }
}
async function disableAvisos(silent = false){
  const c = avisosCfg();
  setAvisosCfg({on:false, endpoint:'', sent:''});
  clearTimeout(ui.avisosTimer);
  ui.avisosTimer = 0;
  if (!silent){ ui.avisosBusy = true; renderAvisos(); }
  try { const reg = await registerSW(); const sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); }
  catch (e) { console.warn(e); }
  if (c.id) try { await avisosPost({accion:'borrar', id:c.id}); } catch (e) { console.warn(e); }   // si falla, el servidor la borra solo al primer aviso rechazado
  ui.avisosBusy = false;
  renderAvisos();
  if (!silent) toast('🔕 Listo, no te mandamos más avisos.');
}
async function testAvisos(){
  const c = avisosCfg();
  if (ui.avisosBusy || !c.id) return;
  ui.avisosBusy = true;
  renderAvisos();
  try {
    try { await avisosPost({accion:'probar', id:c.id}); }
    catch (e) {
      if (e.code !== 'sin_suscripcion' || !(await repairSubscription())) throw e;
      await avisosPost({accion:'probar', id:c.id});
    }
    toast('📨 Aviso de prueba enviado: te tendría que llegar en unos segundos.');
  } catch (e) {
    if (e.code === 'suscripcion_vencida' || e.code === 'sin_suscripcion'){
      setAvisosCfg({on:false, endpoint:'', sent:''});
      toast('Los avisos se dieron de baja en este celular. Tocá «Activar avisos» de nuevo.');
    } else toast(e.message);
  } finally {
    ui.avisosBusy = false;
    renderAvisos();
  }
}
// Cada cambio guardado actualiza las fechas en el servidor (un rato después, todo junto).
function scheduleAvisosSync(){
  if (!avisosCfg().on) return;
  clearTimeout(ui.avisosTimer);
  ui.avisosTimer = setTimeout(() => { ui.avisosTimer = 0; syncAvisos(); }, 2000);
}
// Las sincronizaciones van en fila, para que la última que llega al servidor sea la más nueva.
function syncAvisos(opts = {}){
  const run = () => doSyncAvisos(opts);
  return ui.avisosQueue = (ui.avisosQueue || Promise.resolve()).then(run, run);
}
async function doSyncAvisos({force = false, keepalive = false}){
  const c = avisosCfg();
  if (!c.on || !c.id) return true;
  const plan = avisosPlan(), sig = planSig(plan, c.hora);
  if (!force && sig === c.sent) return true;
  try {
    await avisosPost({accion:'plan', id:c.id, plan, hora:c.hora, tz:tzName()}, keepalive);
    setAvisosCfg({sent:sig});
    return true;
  } catch (e) {
    if (e.code === 'sin_suscripcion') return repairSubscription();
    console.warn('No se pudieron actualizar los avisos', e);   // se reintenta con el próximo cambio o al volver a la app
    return false;
  }
}
// Al abrir la app: si el celular dio de baja los avisos o sacaron el permiso, se apagan; si no, se ponen al día.
async function checkAvisos(){
  const c = avisosCfg();
  if (!c.on || !servedOnline()) return;
  if (!pushSupported() || Notification.permission !== 'granted') return disableAvisos(true);
  try {
    const reg = await registerSW();
    const sub = await reg.pushManager.getSubscription();
    if (!sub) return await disableAvisos(true);
    if (sub.endpoint !== c.endpoint) await saveSubscription(sub);
    else await syncAvisos();
  } catch (e) { console.warn(e); }
}
async function setAvisosHora(hora){
  const c = setAvisosCfg({hora});
  if (!c.on) return;
  toast(await syncAvisos({force:true}) ? `⏰ Listo: los avisos te van a llegar a las ${hora} h.` : 'No se pudo cambiar la hora. Revisá tu conexión y probá de nuevo.');
  renderAvisos();
}

function avisosCardHTML(){

  const hora = `<div class="form" style="margin-top:14px"><label class="field"><span>¿A qué hora te aviso?</span><select id="avisos-hora"${dis}>${AVISOS_HORAS.map(h => `<option value="${h}"${h === c.hora ? ' selected' : ''}>${h} h</option>`).join('')}</select></label></div>`;
  const privacy = '<p class="small muted" style="margin:12px 0 0">Para mandarte los avisos, el servidor guarda solo los nombres de tus plantas y las fechas de riego, abono y fotos de control (nada de fotos ni notas). Si desactivás los avisos, se borra todo.</p>';
  let body;
  if (st === 'archivo') body = '<p class="banner" style="margin:10px 0 0">Los avisos funcionan en la app publicada en Netlify.</p>';
  else if (st === 'instalar') body = `<p class="muted">En iPhone, los avisos solo funcionan con Brote instalada en la pantalla de inicio (iOS 16.4 o más nuevo):</p>
    <ol class="steps-n compact"><li>Abrila en Safari y tocá el botón Compartir.</li><li>Elegí «Agregar a pantalla de inicio».</li><li>Abrí Brote desde el ícono nuevo y volvé a esta pantalla.</li></ol>`;
  else if (st === 'no-soportado') body = '<p class="muted">Este navegador no permite avisos. En Android usá Chrome; en iPhone, instalá Brote en la pantalla de inicio.</p>';
  else if (st === 'bloqueado') body = '<p class="muted">Los avisos están bloqueados para Brote. Para habilitarlos, entrá a los ajustes del celular (o del navegador) → Notificaciones → Brote, permitilos y volvé a esta pantalla.</p>';
  else if (st === 'activo') body = `<p class="ok-line">🔔 Avisos activados. Si alguna planta necesita algo, te escribimos a las ${c.hora} h.</p>${hora}
    <div class="btn-row"><button class="btn" type="button" data-action="avisos-test"${dis}>Probar aviso</button><button class="btn ghost" type="button" data-action="avisos-off"${dis}>Desactivar</button></div>${privacy}`;
  else body = `<p class="muted">Brote te avisa en el celular cuando una planta necesita agua, abono o una foto de control. Como mucho un aviso por día, y solo si hay algo que hacer.</p>${hora}
    <div class="btn-row"><button class="btn primary" type="button" data-action="avisos-on"${dis}>${ui.avisosBusy ? 'Activando…' : 'Activar avisos'}</button></div>${privacy}`;
  return `<section class="card" id="avisos-card"><h2>Avisos en el celular</h2>${body}</section>`;
}
function avisosNudgeHTML(){
  if (!avisosCfg().nudge || !['apagado', 'instalar'].includes(avisosState())) return '';
  return `<p class="care-line nudge" id="avisos-nudge">🔔 ¿Querés que te avise cuando una planta necesite agua? <a class="linkbtn" href="#ajustes" data-action="go-avisos">Activar avisos →</a>
    <button class="icon-btn" type="button" data-action="nudge-off" aria-label="No mostrar más esta sugerencia">✕</button></p>`;
}
function renderAvisos(){
  const card = $('#avisos-card');
  if (card){
    // Mientras está ocupado los botones se deshabilitan: el foco vuelve al terminar.
    if (card.contains(document.activeElement)) ui.avisosFocus = true;
    card.outerHTML = avisosCardHTML();
    const btn = ui.avisosFocus && $('#avisos-card button:not([disabled])');
    if (btn){ btn.focus({preventScroll:true}); ui.avisosFocus = false; }
  } else ui.avisosFocus = false;
  if (!avisosNudgeHTML()) $('#avisos-nudge')?.remove();
}

/* =====================================================================
   Render y navegación
   ===================================================================== */
const VIEWS = {hoy:viewHoy, plantas:viewPlantas, cuidados:viewCuidados, guia:viewGuia, ajustes:viewAjustes};
const currentTab = () => { const h = location.hash.slice(1); return VIEWS[h] ? h : 'hoy'; };
const BASE_TITLE = 'Brote · Cuidado de plantas';

function render(){
  const tab = currentTab();
  document.querySelectorAll('.tabs a').forEach(a => {
    if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  $('#view').innerHTML = VIEWS[tab]();
  $('#fab').hidden = !(['hoy','plantas'].includes(tab) && state.plants.length);
  const due = state.plants.length ? collectTasks().due.length : 0;
  const badge = $('#badge-hoy');
  badge.hidden = !due;
  badge.textContent = due > 99 ? '99+' : due;
  document.title = due ? `(${due}) ${BASE_TITLE}` : BASE_TITLE;
  // Deja todo listo antes de que toquen «Activar avisos» (en iPhone conviene no hacer esperar al permiso).
  if (tab === 'ajustes' && avisosState() === 'apagado'){ registerSW().catch(() => {}); vapidKey().catch(() => {}); }
}
function refresh(){
  render();
  const m = ui.modal;
  if (!m) return;
  if (m.kind === 'detail'){
    const p = getPlant(m.id);
    if (p){ const top = modalBody.scrollTop; modalBody.innerHTML = detailHTML(p); modalBody.scrollTop = top; loadGallery(p.id); }
    else closeModal();
  } else if (m.kind === 'treatment'){
    const p = getPlant(m.id), t = findTreatment(p, m.tid);
    if (t){ const top = modalBody.scrollTop; modalBody.innerHTML = treatmentHTML(p, t); modalBody.scrollTop = top; }
    else closeModal();
  } else if (m.kind === 'photo' && !ui.busy){
    if (getPlant(m.id)) openPhoto(m.photoId, m.logId, true); else closeModal();
  }
}

let toastTimer;
function toast(msg, undo){
  const el = $('#toast');
  // Si hay un modal abierto, el aviso tiene que vivir dentro de él para quedar por encima.
  const host = modal.open ? modal : document.body;
  if (el.parentElement !== host) host.appendChild(el);
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Deshacer</button>' : ''}`;
  if (undo) el.querySelector('button').onclick = () => { clearTimeout(toastTimer); el.classList.remove('show'); undo(); };
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 6500 : 3500);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const {action, id, type} = el.dataset;
  switch (action){
    case 'open': openDetail(id); break;
    case 'close': closeModal(); break;
    case 'add': openForm(null); break;
    case 'add-species': openForm(null, el.dataset.species); break;
    case 'edit': openForm(getPlant(id)); break;
    case 'delete': deletePlant(id); break;
    case 'done': markDone(id, type); break;
    case 'snooze': snooze(id, type); break;
    case 'water-all': waterAll(); break;
    case 'log-form': { const p = getPlant(id); if (p) openModal(logFormHTML(p), {kind:'log', id}, 'Registrar actividad'); break; }
    case 'del-log': deleteLog(id, el.dataset.log); break;
    case 'care-photo': openModal(pickPlantHTML('photo'), {kind:'pick'}, 'Elegir planta'); break;
    case 'symptoms': openSymptoms(id); break;
    case 'sym-toggle': {
      const k = el.dataset.sym;
      if (ui.sym.selected.has(k)) ui.sym.selected.delete(k); else ui.sym.selected.add(k);
      el.setAttribute('aria-pressed', String(ui.sym.selected.has(k)));
      const go = $('#sym-go');
      if (go){ go.disabled = !ui.sym.selected.size; go.textContent = symGoLabel(ui.sym.selected.size); }
      break;
    }
    case 'sym-results': if (ui.sym.selected.size) openModal(symResultsHTML(), {kind:'sym-results'}, 'Causas más probables'); break;
    case 'sym-back': openModal(symptomsHTML(), {kind:'symptoms'}, 'Buscador de síntomas'); break;
    case 'problem-open': openProblem(el.dataset.problem, id, el.dataset.from, el.dataset.tid); break;
    case 'care-filter':
      ui.careFilter = el.dataset.cat;
      document.querySelectorAll('[data-action="care-filter"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      $('#problem-list').innerHTML = problemListHTML();
      break;
    case 'treat-start':
      if (id) startTreatment(id, el.dataset.problem, el.dataset.origin);
      else openModal(pickPlantHTML('treat', el.dataset.problem, el.dataset.origin), {kind:'pick'}, 'Elegir planta');
      break;
    case 'pick-treat': startTreatment(id, el.dataset.problem, el.dataset.origin); break;
    case 'treat-open': openTreatment(id, el.dataset.tid); break;
    case 'treat-from-diag': treatFromDiag(id, el.dataset.log); break;
    case 'step-toggle': toggleStep(id, el.dataset.tid, Number(el.dataset.i)); break;
    case 'treat-resolve': resolveTreatment(id, el.dataset.tid); break;
    case 'treat-delete': deleteTreatment(id, el.dataset.tid); break;
    case 'week-day':
      ui.weekDate = el.dataset.date;
      $('#week').innerHTML = weekHTML();
      $(`#week [data-date="${ui.weekDate}"]`)?.focus();
      break;
    case 'loc-filter':
      ui.locFilter = el.dataset.loc;
      document.querySelectorAll('[data-action="loc-filter"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      $('#plant-list').innerHTML = plantListHTML();
      break;
    case 'view-photo': openPhoto(el.dataset.photo || null, el.dataset.log || null); break;
    case 'diagnose': runDiagnosis(); break;
    case 'diag-again': $('#diag-area').innerHTML = diagPromptHTML(); break;
    case 'identify': identifyInForm(el); break;
    case 'set-cover': setCover(el.dataset.photo); break;
    case 'del-photo': deletePhoto(el.dataset.photo); break;
    case 'apply-water': applyWater(id, Number(el.dataset.days)); break;
    case 'apply-species': applySpecies(id, el.dataset.species); break;
    case 'remove-photo': {
      ui.formPhotoSet = null;
      ui.formAnalysis = null;
      $('#ai-identify').hidden = true;
      $('#photo-preview').innerHTML = (SPECIES_BY_ID[$('#species-select').value] || SPECIES_BY_ID.otra).emoji;
      $('#photo-label').textContent = 'Agregar foto';
      el.hidden = true;
      break;
    }
    case 'guide-filter':
      ui.guideFilter = el.dataset.filter;
      document.querySelectorAll('.filter').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      $('#guide-list').innerHTML = guideListHTML();
      break;
    case 'export-ics':
      download(`brote-recordatorios-${todayISO()}.ics`, buildICS(), 'text/calendar;charset=utf-8');
      toast('📅 Calendario descargado. Abrilo para importarlo en tu app de calendario.');
      break;
    case 'export-json': exportBackup(); break;
    case 'import-json': $('#import-file').click(); break;
    case 'wipe':
      if (confirm('¿Borrar TODAS las plantas, fotos e historial? Esta acción se puede deshacer solo durante unos segundos.'))
        { act('🗑️ Se borraron todos los datos', () => { state.plants = []; }); ui.galleryCache = {}; scheduleGC(); }
      break;
    case 'avisos-on': enableAvisos(); break;
    case 'avisos-off': disableAvisos(); break;
    case 'avisos-test': testAvisos(); break;
    case 'go-avisos': ui.scrollTo = 'avisos-card'; break;   // el enlace lleva a Ajustes y ahí baja hasta los avisos
    case 'nudge-off':
      setAvisosCfg({nudge:false});
      $('#avisos-nudge')?.remove();
      toast('Listo, no te lo muestro más. Los avisos se activan desde Ajustes cuando quieras.');
      break;
  }
});

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')){
    e.preventDefault();
    e.target.click();
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'plant-search'){ ui.search = e.target.value; $('#plant-list').innerHTML = plantListHTML(); }
  if (e.target.id === 'guide-search'){ ui.guideSearch = e.target.value; $('#guide-list').innerHTML = guideListHTML(); }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'species-select'){
    const sp = SPECIES_BY_ID[el.value] || SPECIES_BY_ID.otra;
    const form = el.form;
    form.waterEvery.value = sp.riego;
    form.fertEvery.value = sp.abono;
    form.name.placeholder = sp.id === 'otra' ? 'Ej.: Helecho de la abuela' : sp.name;
    $('#species-hint').innerHTML = speciesHint(sp);
    const hasPhoto = ui.formPhotoSet || (ui.formPhotoSet === undefined && $('#photo-preview img'));
    if (!hasPhoto) $('#photo-preview').innerHTML = sp.emoji;
  }
  else if (el.classList.contains('cam-input') && el.files[0]){
    const file = el.files[0];
    el.value = '';
    await takePhoto(el.dataset.plant, file);
  }
  else if (el.id === 'sym-plant'){
    ui.sym.plantId = el.value;
    $('#sym-ai').innerHTML = symAiHint();
  }
  else if (el.id === 'set-model'){
    setModel(el.value);
    const g = $('#gasto-card');
    if (g) g.outerHTML = gastoHTML();   // el costo por foto depende del modelo
    toast(`Modelo elegido: ${MODEL_INFO[el.value][0]}`);
  }
  else if (el.id === 'photo-input' && el.files[0]){
    const label = $('#photo-label');
    label.textContent = 'Procesando…';
    try {
      const set = await makePhotoSet(el.files[0]);
      if (!$('#plant-form')) return;
      ui.formPhotoSet = set;
      ui.formAnalysis = null;
      $('#photo-preview').innerHTML = `<img src="${set.cover}" alt="">`;
      label.textContent = 'Cambiar foto';
      $('[data-action="remove-photo"]').hidden = false;
      const box = $('#ai-identify');
      box.innerHTML = identifyBoxHTML();
      box.hidden = false;
    } catch (err) {
      label.textContent = $('#photo-preview img') ? 'Cambiar foto' : 'Agregar foto';
      toast(err.message);
    }
    el.value = '';
  }
  else if (el.id === 'import-file' && el.files[0]){
    await importFile(el.files[0]);
    el.value = '';
  }
  else if (el.id === 'set-seasonal'){
    act(el.checked ? '🌦️ Ajuste estacional activado' : 'Ajuste estacional desactivado', () => { state.settings.seasonal = el.checked; });
  }
  else if (el.name === 'hemi'){
    act(`Hemisferio ${el.value === 'S' ? 'sur' : 'norte'} seleccionado`, () => { state.settings.hemisphere = el.value; });
  }
  else if (el.id === 'avisos-hora'){
    await setAvisosHora(clampInt(el.value, 0, 23, 9));
  }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'plant-form'){ e.preventDefault(); savePlantForm(e.target); }
  if (e.target.id === 'log-form'){ e.preventDefault(); saveLogForm(e.target); }
});

window.addEventListener('hashchange', () => {
  closeModal();
  render();
  const target = ui.scrollTo && document.getElementById(ui.scrollTo);
  ui.scrollTo = null;
  if (target) target.scrollIntoView({block:'start'}); else window.scrollTo(0, 0);
});
// Si la pestaña queda abierta de un día para el otro, actualizar las tareas.
function checkNewDay(){ const t = todayISO(); if (t !== ui.lastDay){ ui.lastDay = t; refresh(); } }
document.addEventListener('visibilitychange', () => {
  if (!document.hidden){ checkNewDay(); syncAvisos(); return; }
  // Si cierran la app justo después de regar, las fechas nuevas salen igual.
  if (ui.avisosTimer){ clearTimeout(ui.avisosTimer); ui.avisosTimer = 0; syncAvisos({keepalive:true}); }
});
setInterval(checkNewDay, 60 * 1000);
// Sincronizar si la app está abierta en otra pestaña.
window.addEventListener('storage', e => { if (e.key === STORAGE_KEY){ state = load(); refresh(); } });

render();
if (storageOK && !loadFailed) gcPhotos();
try { localStorage.removeItem('brote.apiKey'); } catch {}   // de una versión anterior que guardaba la clave en el celular
// El service worker solo recibe y muestra los avisos (no guarda nada en caché).
if ('serviceWorker' in navigator && servedOnline()) registerSW().catch(e => console.warn('No se pudo registrar el service worker', e));
checkAvisos();
