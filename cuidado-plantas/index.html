<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A15" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brote">
<meta name="description" content="Brote: organizá el riego y el cuidado de tus plantas, con fotos y diagnóstico con IA. Tus datos quedan en tu celular.">
<title>Brote · Cuidado de plantas</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* =====================================================================
     Diseño "Botánico editorial": papel crema, tinta verde oscura, serifa
     Fraunces para títulos, fotos enmarcadas en arco y líneas finas.
     ===================================================================== */
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/fraunces-latin.woff2) format('woff2')}
  @font-face{font-family:'Fraunces';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/fraunces-italic-latin.woff2) format('woff2')}
  :root{
    --bg:#F4EFE4; --paper:#FBF8F1; --sand:#E8DEC9; --ink:#1F2A22; --ink-soft:#3A453D; --muted:#6C7063;
    --line:#DCD2BF; --rule:#1F2A22; --moss:#4E6B47; --sage:#8EA67F; --terra:#B5603B; --terra-soft:#F3E2D6;
    --sky:#5B7FA3; --ochre:#946A12; --ochre-soft:#F3E8CF; --danger:#A8432A; --on-ink:#FBF8F1;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171A15; --paper:#1E221B; --sand:#2A2E25; --ink:#EDE6D6; --ink-soft:#D3CBB8; --muted:#A39F8E;
      --line:#363A30; --rule:#CFC7B4; --moss:#A3BF95; --sage:#6F8A64; --terra:#DE8E66; --terra-soft:#3A2A20;
      --sky:#93AFCF; --ochre:#DDB45E; --ochre-soft:#342B17; --danger:#E7896B; --on-ink:#171A15;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  @media(min-width:760px){ body{padding-bottom:64px} }
  a{color:var(--terra)}
  h1,h2,h3,h4{line-height:1.15;font-weight:400}
  .wrap{max-width:960px;margin:0 auto;padding:0 22px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  [hidden]{display:none !important}
  :focus-visible{outline:2px solid var(--terra);outline-offset:2px}
  .eyebrow{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted)}
  svg.i{width:20px;height:20px;flex-shrink:0}

  /* ---------- Encabezado y navegación ---------- */
  header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
  .top-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;font-family:var(--serif);font-size:25px;letter-spacing:-.01em}
  .brand svg{width:30px;height:30px}
  .tabs{display:flex;gap:4px}
  .tabs a{position:relative;display:flex;align-items:center;gap:7px;padding:8px 12px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
  .tabs a:hover{color:var(--ink)}
  .tabs a[aria-current="page"]{color:var(--ink);font-weight:650}
  .tabs a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:-2px;width:5px;height:5px;border-radius:50%;background:var(--terra);transform:translateX(-50%)}
  .badge{min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--terra);color:#fff;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1}
  @media(max-width:759px){
    .brand{display:none}
    .top-inner{min-height:0;border:0}
    .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);
      padding:10px 6px calc(10px + env(safe-area-inset-bottom));justify-content:space-around}
    .tabs a{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:2px 4px 6px}
    .tabs a svg.i{width:23px;height:23px}
    .tabs a[aria-current="page"]::after{bottom:-3px}
    .tabs .badge{position:absolute;top:-5px;left:calc(50% + 5px)}
  }

  /* ---------- Bloques generales ---------- */
  main{padding-top:22px}
  .hero,.page-head{margin:4px 0 6px}
  .hero h1,.page-head h1{font-family:var(--serif);font-size:42px;letter-spacing:-.015em;margin:8px 0 6px}
  .lead{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--moss);margin:0}
  .page-head p.muted{margin:0;max-width:60ch}
  .sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:7px;margin:30px 0 2px}
  .sec h2{font-family:var(--serif);font-weight:600;font-size:17px;margin:0}
  .sec .aside{font-size:12.5px;color:var(--muted);text-align:right}
  .linkbtn{border:0;background:none;padding:0;font:inherit;font-size:13.5px;font-weight:650;color:var(--terra);cursor:pointer;text-decoration:none}
  .linkbtn:hover{text-decoration:underline}
  .tipline{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14.5px;margin:10px 0 0}
  .note{font-family:var(--serif);font-style:italic;color:var(--moss);font-size:15px;margin:0}
  .card{border-top:1px solid var(--rule);padding:18px 0 26px}
  .card h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 6px}
  .card > p:first-of-type{margin-top:0}
  .banner{background:var(--ochre-soft);color:var(--ochre);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px}
  footer.foot{margin:30px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center}

  /* ---------- Botones ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--ink);background:transparent;color:var(--ink);
    padding:10px 18px;border-radius:999px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;transition:background .15s,color .15s}
  .btn:hover{background:var(--sand)}
  .btn.primary{background:var(--ink);color:var(--on-ink)}
  .btn.primary:hover{background:var(--ink-soft)}
  .btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
  .btn.ghost{border-color:transparent}
  .btn.danger{border-color:var(--danger);color:var(--danger)}
  .btn.small{padding:7px 13px;font-size:13.5px}
  .btn[disabled]{opacity:.45;cursor:default;background:transparent}
  .btn.primary[disabled]{background:var(--ink);opacity:.35}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn-row.end{justify-content:flex-end}
  .btn-row.center{justify-content:center}
  .icon-btn{border:0;background:transparent;color:var(--muted);width:40px;height:40px;border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
  .icon-btn:hover{background:var(--sand);color:var(--ink)}
  .circle{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
  .circle svg{width:19px;height:19px}
  .circle:hover{background:var(--ink);color:var(--on-ink)}
  .circle.soft{border-color:var(--line);color:var(--muted)}
  .circle.soft:hover{background:var(--sand);color:var(--ink)}
  .fab{position:fixed;right:20px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:25;width:60px;height:60px;border-radius:50%;border:0;background:var(--terra);color:#fff;
    display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 10px 24px rgba(150,70,35,.32);font:inherit;font-size:15px;font-weight:650}
  .fab svg{width:28px;height:28px}
  .fab .fab-lbl{display:none}
  @media(min-width:760px){ .fab{bottom:32px;right:32px;width:auto;padding:0 24px 0 18px;border-radius:999px} .fab svg{width:22px;height:22px} .fab .fab-lbl{display:inline} }

  /* ---------- Hoy ---------- */
  .tasks{list-style:none;margin:0;padding:0}
  .task{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .thumb{flex-shrink:0;width:52px;height:64px;border:0;padding:0;cursor:pointer;background:var(--sand);border-radius:999px 999px 10px 10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .emoji{font-size:26px}
  .task-body{flex:1;min-width:0}
  .task-body strong{display:block;font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task-meta{font-size:13px;color:var(--muted);margin-top:3px}
  .task-meta b{font-weight:650;color:var(--ink)}
  .task-meta b.late{color:var(--terra)}
  .task-actions{display:flex;gap:8px;flex-shrink:0}
  .alldone{padding:22px 0 6px}
  .alldone p{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--moss);margin:0}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
  .week button{border:0;background:none;cursor:pointer;padding:9px 0 10px;border-radius:999px;font:inherit;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
  .week button b{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--ink);line-height:1.25}
  .week button.today:not([aria-pressed="true"]) b{text-decoration:underline;text-decoration-color:var(--terra);text-underline-offset:4px}
  .week button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
  .week button[aria-pressed="true"] b{color:var(--on-ink)}
  .dots{display:flex;gap:3px;height:6px;align-items:center}
  .dots i,.legend i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--sky)}
  .dots i.abono,.legend i.abono{background:var(--terra)}
  .dots i.revision,.legend i.revision{background:var(--moss)}
  .week button[aria-pressed="true"] .dots i.riego{background:#9FC0E3}
  .legend i{margin:0 3px 1px 8px;vertical-align:middle}
  .daylabel{font-family:var(--serif);font-style:italic;color:var(--muted);margin:14px 0 0;font-size:16px}
  .daylist{list-style:none;padding:0;margin:4px 0 0}
  .daylist li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .mini-thumb{width:36px;height:44px;border-radius:999px 999px 8px 8px;overflow:hidden;background:var(--sand);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .mini-thumb img{width:100%;height:100%;object-fit:cover}
  .link-btn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;flex:1;min-width:0}
  .link-btn .nm{font-family:var(--serif);font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link-btn:hover .nm{text-decoration:underline}
  .daylist .what{font-size:12.5px;color:var(--muted);flex-shrink:0}

  /* ---------- Tu jardín ---------- */
  .toolbar{margin:10px 0 0}
  .search{width:100%;padding:10px 2px;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:16px}
  .search::placeholder{color:var(--muted)}
  .search:focus{outline:none;border-bottom-color:var(--terra)}
  .pills,.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0;padding:0;list-style:none}
  .pill,.filter{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .pill[aria-pressed="true"],.filter[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
  .plant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 16px;margin-top:22px}
  @media(min-width:760px){ .plant-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:34px 24px} }
  .plant-card{cursor:pointer;display:flex;flex-direction:column;min-width:0}
  .pc-photo{aspect-ratio:4/5;border-radius:999px 999px 14px 14px;overflow:hidden;background:var(--sand);display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .plant-card:hover .pc-photo{transform:translateY(-3px)}
  .pc-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .pc-photo .emoji{font-size:56px}
  .plant-card h3{font-family:var(--serif);font-size:18.5px;margin:11px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc-next{margin:0;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .pc-next.late{color:var(--terra);font-weight:700}
  .pc-next.today{color:var(--sky);font-weight:700}
  .meter{height:2px;background:var(--line);margin-top:9px}
  .meter span{display:block;height:100%;background:var(--sky)}
  .meter.low span{background:var(--terra)}

  /* ---------- Guía ---------- */
  .guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:0 32px;margin-top:14px}
  .guide-card{border-top:1px solid var(--line);padding:20px 0 22px;display:flex;flex-direction:column;gap:12px}
  .gc-head{display:flex;gap:14px;align-items:center}
  .gc-emoji{width:50px;height:62px;border-radius:999px 999px 10px 10px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
  .gc-head h3{font-family:var(--serif);font-size:22px;margin:0}
  .sci{margin:2px 0 0;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px}
  dl.care{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:0;font-size:14px}
  dl.care dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:3px}
  dl.care dd{margin:0}
  .pet-ok{color:var(--moss);font-weight:650}
  .pet-bad{color:var(--terra);font-weight:650}
  .tox-note{margin:0;font-size:13px;color:var(--terra)}
  details summary{cursor:pointer;font-family:var(--serif);font-size:15.5px;color:var(--moss)}
  .tips{margin:6px 0 0;padding-left:18px;font-size:14px}
  .tips li{margin:4px 0}
  .guide-card .btn{align-self:flex-start}

  /* ---------- Estado vacío ---------- */
  .empty{text-align:center;padding:30px 10px 10px;margin-top:24px;border-top:1px solid var(--rule)}
  .empty-art{width:110px;height:136px;margin:0 auto;border-radius:999px 999px 14px 14px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:56px}
  .empty h2{font-family:var(--serif);font-size:27px;margin:18px 0 6px}
  .empty p{margin:0 auto;max-width:40ch;color:var(--muted)}

  /* ---------- Hojas (detalle, foto, formularios) ---------- */
  dialog#modal{border:0;padding:0;background:var(--bg);color:var(--ink);width:100%;max-width:100%;height:100%;max-height:100%;margin:0;inset:0}
  dialog#modal::backdrop{background:rgba(23,26,21,.5)}
  dialog#modal[open]{animation:sheet .22s ease-out}
  @keyframes sheet{from{opacity:0}to{opacity:1}}
  #modal-body{height:100%;overflow:auto;padding:env(safe-area-inset-top) 22px calc(30px + env(safe-area-inset-bottom))}
  @media(min-width:760px){
    dialog#modal{width:min(640px,calc(100vw - 40px));height:auto;max-height:calc(100dvh - 48px);margin:auto;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
    #modal-body{height:auto;max-height:calc(100dvh - 48px);padding:6px 28px 30px}
  }
  .sheet-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -22px;padding:10px 12px;background:var(--bg)}
  @media(min-width:760px){ .sheet-top{margin:0 -28px;padding:10px 16px} }
  .back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;padding:6px 6px;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .back:hover{color:var(--ink)}
  .back svg{width:20px;height:20px}
  .detail-photo,.photo-full{border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--sand);display:flex;align-items:center;justify-content:center;margin:4px 0 20px}
  .detail-photo{height:300px}
  .photo-full{height:min(52vh,430px)}
  .detail-photo img,.photo-full img{width:100%;height:100%;object-fit:cover;display:block}
  .detail-photo .emoji{font-size:92px}
  .photo-full .gone{color:var(--muted);font-family:var(--serif);font-style:italic;margin:0}
  .detail-head h2{font-family:var(--serif);font-size:34px;margin:6px 0 0;letter-spacing:-.01em}
  .detail-head .sci{margin-top:4px}
  .stats{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;border-top:1px solid var(--rule);border-bottom:1px solid var(--line)}
  .stat{padding:12px 14px 14px 0}
  .stat + .stat{border-left:1px solid var(--line);padding-left:16px}
  .stat span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .stat strong{display:block;font-family:var(--serif);font-weight:400;font-size:23px;margin-top:4px}
  .stat strong.late{color:var(--terra)}
  .stat small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
  @media(max-width:420px){ .stats{grid-template-columns:1fr} .stat + .stat{border-left:0;border-top:1px solid var(--line);padding-left:0} }
  .detail-section{margin-top:30px}
  .detail-section > h3,.section-head{border-bottom:1px solid var(--rule);padding-bottom:7px;margin:0 0 10px}
  .detail-section h3{font-family:var(--serif);font-weight:600;font-size:17px}
  .section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .section-head h3{margin:0}
  .notes{white-space:pre-wrap;margin:0;font-family:var(--serif);font-style:italic;font-size:17px}
  .log{list-style:none;margin:0;padding:0}
  .log li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .log .le{width:24px;text-align:center;flex-shrink:0}
  .log .lt{flex:1;min-width:0}
  .log .lt small{display:block;color:var(--muted)}
  .log .icon-btn{width:30px;height:30px;font-size:13px}
  .gallery{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scroll-snap-type:x proximity}
  .gallery button{flex:0 0 auto;width:70px;height:88px;border-radius:999px 999px 10px 10px;overflow:hidden;border:0;padding:0;cursor:pointer;background:var(--sand);position:relative;scroll-snap-align:start}
  .gallery img{width:100%;height:100%;object-fit:cover;display:block}
  .gallery .dx{position:absolute;right:6px;bottom:6px;width:11px;height:11px;border-radius:50%;border:2px solid var(--paper);background:var(--muted)}
  .dx.ok{background:var(--moss)} .dx.leve{background:var(--ochre)} .dx.mod{background:var(--terra)} .dx.grave{background:var(--danger)}
  .review-line{font-family:var(--serif);font-style:italic;color:var(--moss);margin:12px 0 0;font-size:15.5px}

  /* ---------- Diagnóstico con IA ---------- */
  .diag-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .diag-state{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 11px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
  .diag-state.ok{color:var(--moss)} .diag-state.leve{color:var(--ochre)} .diag-state.mod{color:var(--terra)}
  .diag-state.grave{color:var(--danger);background:var(--terra-soft)} .diag-state.na{color:var(--muted)}
  .diag-sum{font-family:var(--serif);font-size:22px;line-height:1.3;margin:12px 0 14px}
  .diag-note{font-family:var(--serif);font-style:italic;color:var(--muted);margin:-6px 0 14px;font-size:15px}
  .sugg{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;font-size:15px}
  .sugg + .sugg{border-top:0}
  .diag h4{font-family:var(--serif);font-weight:600;font-size:17px;margin:26px 0 2px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
  ol.steps-n{list-style:none;padding:0;margin:0;counter-reset:s}
  ol.steps-n li{counter-increment:s;display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}
  ol.steps-n li::before{content:counter(s);font-family:var(--serif);font-size:23px;line-height:1;color:var(--terra);min-width:16px}
  .problem{padding:13px 0;border-bottom:1px solid var(--line)}
  .problem-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
  .problem-head strong{font-family:var(--serif);font-weight:400;font-size:19px}
  .problem p{margin:6px 0 0;font-size:14px}
  .prob{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .prob.alta{color:var(--terra)} .prob.media{color:var(--ochre)}
  .ai-box{border-top:1px solid var(--rule);padding:16px 0 4px}
  .ai-box h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 4px}
  .ai-box > p{margin:0 0 12px}
  .ai-loading{display:flex;gap:14px;align-items:center;padding:16px 0}
  .ai-loading strong{font-family:var(--serif);font-weight:400;font-size:18px}
  .spinner{width:26px;height:26px;flex-shrink:0;border:2px solid var(--line);border-top-color:var(--terra);border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation-duration:3s} }
  .err{background:var(--terra-soft);color:var(--danger);border-radius:12px;padding:10px 13px;margin:0 0 12px;font-size:14px}

  /* ---------- Formularios ---------- */
  .form{display:grid;gap:16px}
  .modal-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .modal-title h2{font-family:var(--serif);font-size:30px;margin:0}
  .field{display:grid;gap:4px}
  .field > span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
  .field small{color:var(--muted);font-size:12px}
  .field input,.field select{width:100%;padding:9px 2px;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:16px}
  .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--terra)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:340px){ .field-row{grid-template-columns:1fr} }
  .photo-pick{display:flex;gap:16px;align-items:center}
  .photo-preview{width:84px;height:104px;border-radius:999px 999px 12px 12px;background:var(--sand);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;flex-shrink:0}
  .photo-preview img{width:100%;height:100%;object-fit:cover}
  .photo-pick p{margin:8px 0 0}
  .hint-box{font-family:var(--serif);font-style:italic;color:var(--moss);font-size:15px;margin-top:-6px}

  /* ---------- Ajustes ---------- */
  .switch-row{display:flex;gap:12px;align-items:flex-start;cursor:pointer;margin-top:12px}
  .switch-row input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex-shrink:0}
  .switch-row small{display:block;color:var(--muted)}
  fieldset{border:0;padding:0;margin:16px 0 0}
  legend{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:6px}
  .radio{display:flex;gap:8px;align-items:center;margin:5px 0;cursor:pointer}
  .radio input{accent-color:var(--ink);width:18px;height:18px}
  table.season{border-collapse:collapse;width:100%;margin-top:16px;font-size:14px}
  table.season th,table.season td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  table.season th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom-color:var(--rule)}
  table.season tr.now td{font-weight:650;background:var(--sand)}
  .steps{margin:8px 0 0;padding-left:20px;font-size:14.5px}
  .steps li{margin:5px 0}
  #avisos-card{scroll-margin-top:calc(72px + env(safe-area-inset-top))}
  @media(max-width:759px){ #avisos-card{scroll-margin-top:calc(12px + env(safe-area-inset-top))} }
  .ok-line{font-family:var(--serif);font-style:italic;color:var(--moss);font-size:17px;margin:2px 0 0}
  table.gasto th:not(:first-child),table.gasto td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .care-line.nudge{align-items:center}
  .care-line.nudge .icon-btn{width:32px;height:32px;font-size:14px;margin-left:auto}

  /* ---------- Ánimo y nivel ---------- */
  .pc-photo{position:relative}
  .pc-mood{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .pc-mood.mood-bad{color:var(--terra)}
  .mood-line{font-family:var(--serif);font-style:italic;font-size:17px;margin:8px 0 0;color:var(--moss)}
  .mood-line.mood-bad{color:var(--terra)}
  .level{display:flex;align-items:center;gap:10px;margin:16px 0 0;font-size:13px;color:var(--muted)}
  .level b{font-family:var(--serif);font-weight:600;font-size:15.5px;color:var(--ink);white-space:nowrap}
  .level .bar{flex:1;min-width:50px;height:3px;background:var(--line)}
  .level .bar i{display:block;height:100%;background:var(--terra)}
  .level small{font-size:12.5px;text-align:right}
  ol.basics li{font-size:15px}

  /* ---------- Biografía ---------- */
  .bio-lead{font-family:var(--serif);font-size:18px;margin:0}
  .bio-lead b{font-weight:600}
  .bio-quote{margin:12px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--terra);font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-soft)}
  .bio-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin:16px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .bio-stats div{text-align:center}
  .bio-stats b{display:block;font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.1}
  .bio-stats span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .bio-photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  .bio-photos p{grid-column:1 / -1;margin:0}
  .bio-photos button{border:0;padding:0;background:none;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
  .bio-photos img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px 12px 12px;display:block;background:var(--sand)}
  .bio-photos span{display:block;margin-top:7px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .bio-species{margin-top:20px}
  .bio-species h4{font-family:var(--serif);font-weight:600;font-size:16px;margin:0 0 4px}
  .bio-species p{margin:8px 0 0;font-size:14.5px}
  .bio-species .eyebrow{margin-right:6px}
  .origin{margin:3px 0 0;font-size:12.5px;color:var(--muted)}

  /* ---------- Cuidados ---------- */
  .care-cta{display:grid;grid-template-columns:1fr;margin-top:18px}
  @media(min-width:640px){ .care-cta{grid-template-columns:1fr 1fr;gap:0 32px} }
  .cta{display:flex;gap:16px;align-items:flex-start;border-top:1px solid var(--rule);padding:18px 0 22px}
  .cta-ico{width:54px;height:66px;flex-shrink:0;border-radius:999px 999px 10px 10px;background:var(--sand);color:var(--moss);display:flex;align-items:center;justify-content:center}
  .cta-ico svg{width:24px;height:24px}
  .cta h2{font-family:var(--serif);font-size:22px;margin:0 0 4px}
  .cta p{margin:0 0 12px;color:var(--muted);font-size:14px}
  .care-line{font-family:var(--serif);font-style:italic;color:var(--moss);font-size:17px;margin:22px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
  .care-line .linkbtn{font-family:var(--sans);font-style:normal}
  .tlist{list-style:none;margin:0;padding:0}
  .tlist li{border-bottom:1px solid var(--line)}
  .row-btn{width:100%;display:flex;gap:14px;align-items:center;padding:11px 0;border:0;background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
  .row-btn:hover strong{text-decoration:underline}
  .row-btn .tt{flex:1;min-width:0}
  .row-btn strong{display:block;font-family:var(--serif);font-weight:400;font-size:18px;line-height:1.25}
  .row-btn small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
  .row-btn svg.i{color:var(--muted)}
  .pe{width:42px;height:42px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .sheet-title{font-family:var(--serif);font-size:32px;margin:6px 0 0;letter-spacing:-.01em}
  .problem-hero{height:150px;border-radius:999px 999px 18px 18px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:64px;margin:4px 0 18px}
  .sym-group{margin-top:20px}
  .sym-group .pills{margin-top:8px}
  .sheet-bottom{position:sticky;bottom:calc(-30px - env(safe-area-inset-bottom));z-index:2;margin:22px -22px 0;padding:14px 22px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  .sheet-bottom .btn{width:100%}
  @media(min-width:760px){ .sheet-bottom{bottom:-30px;margin:22px -28px 0;padding:14px 28px} }
  .result{padding:16px 0;border-bottom:1px solid var(--line)}
  .result .problem-head strong{font-size:20px}
  ol.steps-n.compact li{padding:8px 0;font-size:14px}
  ol.steps-n.compact li::before{font-size:19px}
  .progress{display:flex;align-items:center;gap:12px;margin:18px 0 6px;font-size:13px;color:var(--muted)}
  .progress .bar{flex:1;height:3px;background:var(--line)}
  .progress .bar i{display:block;height:100%;background:var(--moss)}
  .steps-check{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  .steps-check li{border-bottom:1px solid var(--line)}
  .steps-check button{width:100%;display:flex;gap:13px;align-items:flex-start;padding:13px 0;border:0;background:none;font:inherit;font-size:15.5px;line-height:1.4;color:var(--ink);text-align:left;cursor:pointer}
  .steps-check .box{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;margin-top:-1px}
  .steps-check .box svg{width:14px;height:14px;opacity:0}
  .steps-check [aria-pressed="true"] .box{background:var(--moss);border-color:var(--moss);color:#fff}
  .steps-check [aria-pressed="true"] .box svg{opacity:1}
  .steps-check [aria-pressed="true"] .tx{text-decoration:line-through;color:var(--muted)}
  .danger-link{color:var(--danger)}

  /* ---------- Aviso flotante ---------- */
  #toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 28px);bottom:calc(172px + env(safe-area-inset-bottom));transform:translateY(16px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--on-ink);border-radius:16px;padding:11px 12px 11px 18px;display:flex;gap:12px;align-items:center;font-size:14.5px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);transition:opacity .18s,transform .18s;z-index:100}
  #toast.show{opacity:1;transform:translateY(0);pointer-events:auto}
  #toast button{border:0;background:transparent;color:#E9A07C;font:inherit;font-weight:700;padding:6px 8px;border-radius:10px;cursor:pointer;flex-shrink:0}
  @media (prefers-color-scheme: dark){ #toast button{color:#9E4426} }
  @media(min-width:760px){ #toast{bottom:36px} }
</style>

<script>
'use strict';

/* =====================================================================
   Catálogo de especies
   - riego / abono: frecuencia orientativa en días (interior, clima templado,
     primavera). El ajuste estacional la modifica según la época del año.
   - toxica: según la base de datos de plantas tóxicas y no tóxicas de la ASPCA
     (true = tóxica para perros/gatos, false = no tóxica, null = varía / sin datos).
   ===================================================================== */
const SPECIES = [
  {id:'potus', cat:'interior', name:'Potus', sci:'Epipremnum aureum', emoji:'🍃', luz:'Luz media; aguanta lugares con poca luz', riego:7, abono:30, humedad:'Media', dificultad:'Muy fácil', toxica:true, toxNota:'Contiene oxalatos de calcio, que irritan la boca y el estómago.', riegoNota:'Regá cuando los primeros 2–3 cm de tierra estén secos (meté un dedo para fijarte).', tips:['Con poca luz sobrevive, pero las manchas claras de sus hojas se van poniendo verdes.','Cortale las puntas de las ramas para que se ponga más tupido.','Un gajo con un par de hojas echa raíces fácil en un frasco con agua.']},
  {id:'monstera', cat:'interior', name:'Costilla de Adán', sci:'Monstera deliciosa', emoji:'🌿', luz:'Mucha luz, sin sol directo', riego:8, abono:30, humedad:'Media a alta', dificultad:'Fácil', toxica:true, toxNota:'Contiene oxalatos de calcio.', riegoNota:'Regá cuando la mitad superior de la maceta esté seca.', tips:['Si las hojas nuevas salen sin perforaciones, probablemente le falte luz.','Una estaca forrada en musgo o fibra de coco (la venden en viveros) la ayuda a crecer derecha y con hojas más grandes.','Limpiá las hojas con un paño húmedo para sacarles el polvo.']},
  {id:'sansevieria', cat:'interior', name:'Lengua de suegra', sci:'Dracaena trifasciata (Sansevieria)', emoji:'🪴', luz:'Cualquier lugar: aguanta poca luz y también sol suave', riego:18, abono:60, humedad:'Baja', dificultad:'Muy fácil', toxica:true, toxNota:'Contiene saponinas (pueden causar vómitos y diarrea).', riegoNota:'Regá solo cuando la tierra esté seca del todo.', tips:['Si la regás de más, se pudre desde la base: ante la duda, no riegues.','Evitá que se acumule agua en el centro de la roseta.','Ideal para dormitorios y rincones con poca luz.']},
  {id:'zamioculca', cat:'interior', name:'Zamioculca', sci:'Zamioculcas zamiifolia', emoji:'🌱', luz:'Luz media o poca luz', riego:16, abono:60, humedad:'Baja', dificultad:'Muy fácil', toxica:true, toxNota:'Contiene oxalatos de calcio (irritante).', riegoNota:'Regá solo cuando la tierra esté seca del todo.', tips:['Guarda agua en sus raíces gruesas: aguanta semanas sin riego.','Hojas amarillas y tallos blandos suelen ser señal de exceso de agua.','Crece lento; no la trasplantes hasta que las raíces llenen la maceta.']},
  {id:'cinta', cat:'interior', name:'Cinta', sci:'Chlorophytum comosum', emoji:'🎋', luz:'Mucha luz, sin sol directo', riego:7, abono:30, humedad:'Media', dificultad:'Muy fácil', toxica:false, toxNota:'', riegoNota:'Regá cuando la tierra de arriba esté seca; no dejes que se seque toda.', tips:['Las puntas marrones suelen deberse al cloro o al flúor del agua: usá agua reposada.','Los hijuelos que cuelgan enraízan fácil en agua o en tierra.','Queda muy bien en macetas colgantes.']},
  {id:'espatifilo', cat:'interior', name:'Espatifilo', sci:'Spathiphyllum wallisii', emoji:'🤍', luz:'Luz media, sin sol directo', riego:6, abono:30, humedad:'Alta', dificultad:'Fácil', toxica:true, toxNota:'Contiene oxalatos de calcio.', riegoNota:'Regá cuando la superficie esté seca; no dejes que se seque del todo.', tips:['Cuando tiene sed se "desmaya", y se recupera a las pocas horas de regarla.','El sol directo le quema las hojas.','Para que florezca necesita buena luz indirecta.']},

function normalizeLog(l){

function normalizeTreatment(t){

function normalizePlant(p){
  if (!p || typeof p !== 'object') return null;

  if (p.snooze && isValidISO(p.snooze.riego)) snooze.riego = p.snooze.riego;
  if (p.snooze && isValidISO(p.snooze.abono)) snooze.abono = p.snooze.abono;

function normalizeState(d){
  if (!d || typeof d !== 'object' || !Array.isArray(d.plants)) throw new Error('El archivo no tiene el formato de un respaldo de Brote.');
  const out = defaultState();
  if (d.settings && typeof d.settings === 'object'){
    out.settings.seasonal = d.settings.seasonal !== false;
    out.settings.hemisphere = d.settings.hemisphere === 'N' ? 'N' : 'S';
  }
  const seen = new Set();
  out.plants = d.plants.map(normalizePlant).filter(Boolean).map(p => {
    if (seen.has(p.id)) p.id = uid();
    seen.add(p.id);
    return p;
  });
  out.aiUsage = normalizeUsage(d.aiUsage, out.plants);
  return out;
}
// Gasto en IA por mes: {'2026-11': {n: fotos analizadas, c: US$ aproximados}}.
// Si los datos son de antes de que existiera, se arma con los diagnósticos guardados.
function normalizeUsage(u, plants){
  const out = {};
  if (u && typeof u === 'object' && !Array.isArray(u)){
    for (const [k, v] of Object.entries(u)){
      if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(k) || !v || typeof v !== 'object') continue;
      const n = clampInt(v.n, 0, 1e6, 0), c = Number(v.c);
      if (n) out[k] = {n, c:Number.isFinite(c) && c > 0 ? Math.min(c, 1e5) : 0};
    }
  } else {
    for (const p of plants) for (const l of p.log){
      if (l.type !== 'diagnostico') continue;
      const m = out[l.date.slice(0, 7)] ||= {n:0, c:0};
      m.n++;
      if (l.meta && l.meta.costo > 0) m.c += l.meta.costo;
    }
  }
  return Object.fromEntries(Object.entries(out).sort(([a], [b]) => a.localeCompare(b)).slice(-60));
}

// Aplica un cambio; si falla o no se puede guardar, vuelve atrás. Devuelve la foto previa (para "Deshacer").
function commit(fn){
  const snap = JSON.stringify(state);
  try { fn(); }
  catch (e) { state = JSON.parse(snap); console.error(e); toast('Ocurrió un error: ' + e.message); return null; }
  if (!save()){ state = JSON.parse(snap); return null; }
  return snap;
}

/* =====================================================================

const getPlant = id => state.plants.find(p => p.id === id);
const speciesOf = p => SPECIES_BY_ID[p.speciesId] || SPECIES_BY_ID.otra;

function seasonKey(iso = todayISO()){
  const m = Number(iso.slice(5, 7));
  // Hemisferio sur: verano dic–feb, otoño mar–may, invierno jun–ago, primavera sep–nov.
  const south = ['verano','verano','otono','otono','otono','invierno','invierno','invierno','primavera','primavera','primavera','verano'][m - 1];
  if (state.settings.hemisphere === 'N') return {verano:'invierno', invierno:'verano', otono:'primavera', primavera:'otono'}[south];
  return south;
}
const seasonFactor = () => state.settings.seasonal ? SEASONS[seasonKey()].factor : 1;
const adjust = (base, factor) => Math.max(1, Math.round(base * factor));
const waterInterval = p => adjust(p.waterEvery, seasonFactor());
const fertPaused = () => state.settings.seasonal && seasonKey() === 'invierno';

function nextWater(p){
  let due = p.lastWater ? addDays(p.lastWater, waterInterval(p)) : todayISO();
  if (p.snooze.riego && p.snooze.riego > due) due = p.snooze.riego;
  return due;
}
function nextFert(p){
  if (!p.fertEvery || fertPaused()) return null;
  let due = addDays(p.lastFert || p.createdAt, p.fertEvery);
  if (p.snooze.abono && p.snooze.abono > due) due = p.snooze.abono;
  return due;
}
// Foto de control pendiente después de un diagnóstico con problemas.
function nextReview(p){
  if (!p.reviewDue) return null;
  return p.snooze.revision && p.snooze.revision > p.reviewDue ? p.snooze.revision : p.reviewDue;
}
function waterLevel(p){
  if (!p.lastWater) return 0;
  const elapsed = Math.max(0, diffDays(p.lastWater, todayISO()));
  return Math.max(0, Math.min(1, 1 - elapsed / waterInterval(p)));
}
function collectTasks(){
  const t = todayISO(), due = [], soon = [];
  for (const p of state.plants){
    const w = nextWater(p), dw = diffDays(t, w);
    (dw <= 0 ? due : soon).push({p, type:'riego', d:dw, date:w});
    const f = nextFert(p);
    if (f){ const df = diffDays(t, f); (df <= 0 ? due : soon).push({p, type:'abono', d:df, date:f}); }
    const r = nextReview(p);
    if (r){ const dr = diffDays(t, r); (dr <= 0 ? due : soon).push({p, type:'revision', d:dr, date:r}); }
  }
  const cmp = (a, b) => a.d - b.d || TASK_ORDER[a.type] - TASK_ORDER[b.type] || a.p.name.localeCompare(b.p.name, 'es');
  return {due: due.sort(cmp), soon: soon.filter(x => x.d <= 7).sort(cmp)};
}

function plantMood(p){
  if (activeTreatments(p).length) return {emoji:'🤒', label:'En tratamiento', say:'Está en tratamiento', cls:'mood-sick'};
  const d = diffDays(todayISO(), nextWater(p));

  return waterLevel(p) > 0.5 ? {emoji:'😊', label:'Contenta', say:'Está contenta', cls:'mood-ok'} : {emoji:'🙂', label:'Bien', say:'Está bien', cls:'mood-ok'};
}
const GARDENER_LEVELS = [[0, 'Semilla', '🌰'], [10, 'Brote', '🌱'], [25, 'Plantín', '🪴'], [60, 'Mano verde', '🌿'], [150, 'Leyenda del jardín', '🌳']];
const CARE_TYPES = ['riego', 'abono', 'foto', 'diagnostico', 'tratamiento'];
// Cada riego, abono, foto, diagnóstico, tratamiento y paso cumplido suma un cuidado.
function gardenerLevel(){
  const count = state.plants.reduce((n, p) => n + p.log.filter(l => CARE_TYPES.includes(l.type)).length
    + (p.treatments || []).reduce((m, t) => m + t.steps.filter(x => x.done).length, 0), 0);
  let i = 0;
  while (i + 1 < GARDENER_LEVELS.length && count >= GARDENER_LEVELS[i + 1][0]) i++;
  const [from, name, emoji] = GARDENER_LEVELS[i], next = GARDENER_LEVELS[i + 1];
  return {i, name, emoji, count, next:next ? {name:next[1], left:next[0] - count, pct:(count - from) / (next[0] - from)} : null};
}

// Tira de los próximos 7 días: al tocar un día se ve qué toca.
function weekHTML(){
  const t = todayISO();
  const {due, soon} = collectTasks();
  const byDate = {};
  due.forEach(x => (byDate[t] ||= []).push(x));
  soon.forEach(x => (byDate[x.date] ||= []).push(x));
  const days = Array.from({length:7}, (_, i) => addDays(t, i));
  if (!days.includes(ui.weekDate)) ui.weekDate = days.slice(1).find(d => byDate[d]) || t;
  const wd = new Intl.DateTimeFormat('es-AR', {weekday:'short'});
  const strip = days.map(d => {
    const items = byDate[d] || [];
    const name = cap(wd.format(localDate(d)).replace('.', ''));
    return `<button type="button" class="${d === t ? 'today' : ''}" data-action="week-day" data-date="${d}" aria-pressed="${d === ui.weekDate}"
      aria-label="${esc(cap(fmtLong.format(localDate(d))))}: ${items.length} ${plural(items.length, 'tarea', 'tareas')}">${esc(name)}<b>${Number(d.slice(8))}</b>
      <span class="dots">${items.slice(0, 4).map(x => `<i class="${x.type}"></i>`).join('')}</span></button>`;
  }).join('');
  const sel = byDate[ui.weekDate] || [];
  const dd = diffDays(t, ui.weekDate);
  const label = dd === 0 ? 'Hoy' : dd === 1 ? 'Mañana' : cap(fmtLong.format(localDate(ui.weekDate)));
  const list = sel.length
    ? `<ul class="daylist">${sel.map(x => `<li><button class="link-btn" type="button" data-action="open" data-id="${x.p.id}"><span class="mini-thumb">${photoOrEmoji(x.p)}</span><span class="nm">${esc(x.p.name)}</span></button><span class="what">${TASK_VERB[x.type]}</span></li>`).join('')}</ul>`
    : '<p class="muted small" style="margin:4px 0 0">Nada programado.</p>';
  return `<div class="week">${strip}</div><p class="daylabel">${label}</p>${list}`;
}

function plantListHTML(){
  const q = ui.search.trim().toLowerCase();
  const t = todayISO();
  const list = state.plants
    .filter(p => !ui.locFilter || p.location === ui.locFilter)
    .filter(p => !q || [p.name, p.location, speciesOf(p).name, speciesOf(p).sci].join(' ').toLowerCase().includes(q))
    .map(p => ({p, w:nextWater(p)}))
    .sort((a, b) => a.w.localeCompare(b.w) || a.p.name.localeCompare(b.p.name, 'es'));
  if (!list.length) return `<p class="muted">No hay plantas que coincidan${ui.search ? ` con “${esc(ui.search)}”` : ''}.</p>`;
  return list.map(({p, w}) => {
    const d = diffDays(t, w);
    const pct = Math.round(waterLevel(p) * 100);
    const status = d < 0 ? 'Riego atrasado' : d === 0 ? 'Riego · hoy' : d === 1 ? 'Riego · mañana' : `Riego · en ${d} días`;
    return `<article class="plant-card" role="button" tabindex="0" data-action="open" data-id="${p.id}" aria-label="${esc(p.name)}: ${esc(status)}">
      <div class="pc-photo">${photoOrEmoji(p)}<span class="pc-mood ${plantMood(p).cls}">${plantMood(p).emoji} ${plantMood(p).label}</span></div>
      <h3>${esc(p.name)}</h3>
      <p class="pc-next ${whenClass(d)}">${status}</p>
      <div class="meter ${pct < 20 ? 'low' : ''}" role="img" aria-label="Humedad estimada ${pct}%"><span style="width:${pct}%"></span></div>
    </article>`;
  }).join('');
}

function guideMatches(sp){
  const f = ui.guideFilter;
  if (sp.id === 'otra') return false;
  if (f === 'mascotas' && sp.toxica !== false) return false;
  if (['interior','suculenta','huerta','exterior'].includes(f) && sp.cat !== f) return false;
  if (f === 'faciles' && sp.dificultad !== 'Muy fácil') return false;
  const q = ui.guideSearch.trim().toLowerCase();
  if (!q) return true;
  return [sp.name, sp.sci, sp.luz, CATS[sp.cat], sp.dificultad].join(' ').toLowerCase().includes(q);
}
function guideListHTML(){
  const list = SPECIES.filter(guideMatches);

const fmtDayLong = new Intl.DateTimeFormat('es-AR', {day:'numeric', month:'long', year:'numeric'});
function ageText(iso){
  const d = diffDays(iso, todayISO());
  if (d <= 0) return 'desde hoy';
  if (d < 30) return `hace ${d} ${plural(d, 'día', 'días')}`;
  const months = Math.floor(d / 30.44);
  if (months < 12) return `hace ${months} ${plural(months, 'mes', 'meses')}`;
  const y = Math.floor(months / 12), m = months % 12;
  return `hace ${y} ${plural(y, 'año', 'años')}${m ? ` y ${m} ${plural(m, 'mes', 'meses')}` : ''}`;
}
// Biografía: su historia con vos (fecha, relato, números, antes y ahora) y datos de la especie.
function bioHTML(p){
  const sp = speciesOf(p), info = SPECIES_BIO[sp.id];
  const since = p.adoptedAt || p.createdAt;
  const cnt = type => p.log.filter(l => l.type === type).length;
  const tr = p.treatments || [];
  const stats = [[cnt('riego'), 'riego', 'riegos'], [cnt('abono'), 'abono', 'abonos'], [cnt('foto'), 'foto', 'fotos'],
    [cnt('diagnostico'), 'diagnóstico', 'diagnósticos'], [tr.length, 'tratamiento', 'tratamientos'], [tr.filter(t => t.status === 'resuelto').length, 'curado', 'curados']];
  return `<div class="detail-section bio">
    <h3>Biografía</h3>
    <p class="bio-lead">En tu jardín desde el <b>${esc(fmtDayLong.format(localDate(since)))}</b> · ${ageText(since)}</p>
    ${p.story ? `<blockquote class="bio-quote">${esc(p.story)}</blockquote>`
      : `<p class="small muted" style="margin:8px 0 0">¿Cómo llegó a tu casa? <button class="linkbtn" type="button" data-action="edit" data-id="${p.id}">Contalo acá</button></p>`}
    <div class="bio-stats">${stats.map(([n, uno, varios]) => `<div><b>${n}</b><span>${plural(n, uno, varios)}</span></div>`).join('')}</div>
    <div id="bio-photos" class="bio-photos" data-plant="${p.id}">${ui.bioCache[p.id] || ''}</div>
    ${info ? `<div class="bio-species">
      <h4>Sobre la especie</h4>
      <p><span class="eyebrow">Origen</span> ${esc(info[0])}</p>
      <p>${esc(info[1])}</p>
      <p class="note">${esc(info[2])}</p>
    </div>` : ''}
  </div>`;
}
// Antes y ahora: la primera y la última foto de la galería.
function bioPhotosHTML(recs){
  if (!recs || recs.length < 2) return '<p class="small muted">Con dos fotos o más, acá vas a ver el antes y el ahora.</p>';
  const sorted = recs.slice().sort((a, b) => a.createdAt - b.createdAt);
  const cell = (r, label) => `<button type="button" data-action="view-photo" data-photo="${esc(r.id)}"><img src="${esc(r.full)}" alt="${label} (${esc(fmtDate.format(localDate(r.date)))})"><span>${label} · ${esc(fmtDM.format(localDate(r.date)).replace('.', ''))}</span></button>`;
  return cell(sorted[0], 'Antes') + cell(sorted[sorted.length - 1], 'Ahora');
}
function speciesHint(sp){

function markDone(id, type){
  const p0 = getPlant(id);
  if (!p0) return;
  const t = todayISO();
  act(thanks(type, p0.name), () => {
    const p = getPlant(id);
    if (type === 'riego') p.lastWater = maxISO(p.lastWater, t); else p.lastFert = maxISO(p.lastFert, t);
    delete p.snooze[type];
    p.log.push({id:uid(), date:t, type, text:''});
  });
}
function snooze(id, type){
  const p0 = getPlant(id);
  if (!p0 || !SNOOZE_DAYS[type]) return;
  const what = {riego:'riego pospuesto 2 días', abono:'abono pospuesto 1 semana', revision:'foto de control pospuesta 3 días'}[type];
  act(`⏰ ${p0.name}: ${what}`, () => {
    getPlant(id).snooze[type] = addDays(todayISO(), SNOOZE_DAYS[type]);
  });
}
function waterAll(){
  const ids = collectTasks().due.filter(t => t.type === 'riego').map(t => t.p.id);
  const t = todayISO();
  act(`💧 ${ids.length} plantas regadas. ¡Gracias por cuidarlas!`, () => {
    ids.forEach(id => {
      const p = getPlant(id);
      p.lastWater = maxISO(p.lastWater, t);
      delete p.snooze.riego;
      p.log.push({id:uid(), date:t, type:'riego', text:''});
    });
  });
}
function deletePlant(id){
  const p = getPlant(id);
  if (!p || !confirm(`¿Eliminar “${p.name}”? También se borra su historial.`)) return;
  closeModal();
  act(`🗑️ “${p.name}” eliminada`, () => { state.plants = state.plants.filter(x => x.id !== id); });
  scheduleGC();
}
function deleteLog(id, logId){
  act('Registro borrado', () => {
    const p = getPlant(id);
    const entry = p.log.find(l => l.id === logId);
    if (!entry) return;
    p.log = p.log.filter(l => l.id !== logId);
    // Si era el último riego/abono, el calendario pasa a contar desde el registro anterior (si existe).
    const field = entry.type === 'riego' ? 'lastWater' : entry.type === 'abono' ? 'lastFert' : null;
    if (field && p[field] === entry.date){
      const prev = p.log.filter(l => l.type === entry.type).map(l => l.date).sort().pop();
      if (prev) p[field] = prev;
    }
  });
}

function loadImageFile(file){
  const url = URL.createObjectURL(file);
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res({img:i, url});
    i.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen. Probá con una foto JPG o PNG.')); };
    i.src = url;
  });
}
function drawScaled(img, max, quality){
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);   // fondo blanco para PNG con transparencia
  ctx.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', quality);
}
// Tres tamaños: completa (galería y diagnóstico; 1568 px alcanza para ver plagas chicas), portada y miniatura.
async function makePhotoSet(file){
  const {img, url} = await loadImageFile(file);
  try { return {full:drawScaled(img, 1568, 0.85), cover:drawScaled(img, 480, 0.78), thumb:drawScaled(img, 200, 0.72)}; }
  finally { URL.revokeObjectURL(url); }
}
async function rescaleDataURL(dataURL, max, quality){
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('No se pudo leer la foto.'));
    i.src = dataURL;
  });
  return drawScaled(img, max, quality);
}

async function savePlantForm(form){
  const submit = form.querySelector('[type="submit"]');
  if (submit.disabled) return;
  submit.disabled = true;
  const fd = new FormData(form);
  const t = todayISO();

  const data = {
    name: (String(fd.get('name') || '').trim() || (sp.id === 'otra' ? 'Mi planta' : sp.name)).slice(0, 60),
    speciesId: sp.id,
    location: String(fd.get('location') || '').trim().slice(0, 40),
    waterEvery: clampInt(fd.get('waterEvery'), 1, 365, sp.riego),
    fertEvery: clampInt(fd.get('fertEvery'), 0, 365, sp.abono),
    lastWater: dateOrNull(fd.get('lastWater')),
    lastFert: dateOrNull(fd.get('lastFert')),
    notes: String(fd.get('notes') || '').trim().slice(0, 1000),
    story: String(fd.get('story') || '').trim().slice(0, 300),

  const plantId = id || uid();
  const set = ui.formPhotoSet, analysis = ui.formAnalysis;
  // La foto completa va a la galería (IndexedDB); la portada queda en los datos de la planta.
  let photoId = null;
  if (set){
    photoId = uid();
    try { await photosDB.put({id:photoId, plantId, date:t, createdAt:Date.now(), thumb:set.thumb, full:set.full}); }
    catch (e) { console.warn(e); photoId = null; }
  }
  const ok = act(id ? '✏️ Cambios guardados' : `🌱 ${data.name} se sumó a tus plantas`, () => {
    let p;
    if (id){
      p = getPlant(id);
      if (!p) throw new Error('La planta ya no existe.');
      if (p.lastWater !== data.lastWater) delete p.snooze.riego;
      if (p.lastFert !== data.lastFert) delete p.snooze.abono;
      Object.assign(p, data);
      if (set === null) p.photo = null;
    } else {
      p = {id:plantId, createdAt:t, snooze:{}, reviewDue:null, treatments:[], photo:null, log:[{id:uid(), date:t, type:'alta', text:''}], ...data};
      state.plants.push(p);
    }
    if (set){
      p.photo = set.cover;
      if (photoId) p.log.push({id:uid(), date:t, type:'foto', text:'', photoId});
      p.reviewDue = null;
      delete p.snooze.revision;
      if (analysis) addDiagnosisEntry(p, analysis, photoId);

  if (ok){ delete ui.galleryCache[plantId]; openDetail(plantId); }
  else {
    submit.disabled = false;
    if (photoId) photosDB.del(photoId).catch(() => {});
  }
}

/* ---------- Galería de fotos: IndexedDB, mucho más espacio que localStorage ---------- */
let dbPromise = null;
function openPhotoDB(){
  if (!('indexedDB' in window)) return Promise.reject(new Error('Este navegador no permite guardar fotos.'));
  return dbPromise ||= new Promise((res, rej) => {
    const r = indexedDB.open('brote-fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fotos', {keyPath:'id'}).createIndex('plantId', 'plantId');
    r.onsuccess = () => res(r.result);
    r.onerror = () => { dbPromise = null; rej(r.error || new Error('No se pudo abrir la base de fotos.')); };
  });
}
async function photoTx(mode, fn){
  const db = await openPhotoDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('fotos', mode);
    const req = fn(tx.objectStore('fotos'));
    tx.oncomplete = () => res(req ? req.result : undefined);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('No se pudo guardar la foto (¿falta espacio?).'));
  });
}
const photosDB = {
  put: rec => photoTx('readwrite', st => st.put(rec)),
  get: id => photoTx('readonly', st => st.get(id)),
  byPlant: plantId => photoTx('readonly', st => st.index('plantId').getAll(plantId)),
  all: () => photoTx('readonly', st => st.getAll()),
  del: id => photoTx('readwrite', st => st.delete(id)),
};
// Borra las fotos de plantas que ya no existen. Se ejecuta un rato después de borrar
// (para que "Deshacer" siga funcionando) y al abrir la app.
async function gcPhotos(){
  try {
    const ids = new Set(state.plants.map(p => p.id));
    const db = await openPhotoDB();
    await new Promise((res, rej) => {
      const tx = db.transaction('fotos', 'readwrite');
      const store = tx.objectStore('fotos');
      const cur = store.index('plantId').openKeyCursor();
      cur.onsuccess = () => { const c = cur.result; if (!c) return; if (!ids.has(c.key)) store.delete(c.primaryKey); c.continue(); };
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  } catch (e) { console.warn('No se pudo limpiar la galería', e); }
}
let gcTimer;
function scheduleGC(){ clearTimeout(gcTimer); gcTimer = setTimeout(gcPhotos, 10000); }

function galleryHTML(p, recs){
  if (recs === null) return '<span class="small muted">Este navegador no permite guardar fotos.</span>';
  if (!recs.length) return '<span class="small muted">Todavía no hay fotos. Sacale una para llevar un registro de cómo crece y pedir un diagnóstico.</span>';
  const diag = new Map();
  p.log.forEach(l => { if (l.type === 'diagnostico' && l.photoId) diag.set(l.photoId, l); });
  return recs.sort((a, b) => b.createdAt - a.createdAt).map(r => {
    const d = diag.get(r.id), st = d && DIAG_STATES[d.data.estado];
    return `<button type="button" data-action="view-photo" data-photo="${esc(r.id)}" aria-label="Foto del ${esc(fmtDate.format(localDate(r.date)))}${st ? ' · ' + st.label : ''}"><img src="${esc(r.thumb)}" alt="">${st ? `<span class="dx ${st.cls}" aria-hidden="true"></span>` : ''}</button>`;
  }).join('');
}
async function loadGallery(plantId){
  let recs;

  const p = getPlant(plantId), box = $('#gallery');

async function takePhoto(plantId, file){
  if (!getPlant(plantId)) return;
  toast('📷 Guardando foto…');
  let set;
  try { set = await makePhotoSet(file); } catch (e) { return toast(e.message); }
  const id = uid(), t = todayISO();
  let stored = true;
  try { await photosDB.put({id, plantId, date:t, createdAt:Date.now(), thumb:set.thumb, full:set.full}); }
  catch (e) { console.warn(e); stored = false; }
  const ok = act(null, () => {
    const p = getPlant(plantId);
    p.photo = set.cover;
    if (stored) p.log.push({id:uid(), date:t, type:'foto', text:'', photoId:id});
    p.reviewDue = null;
    delete p.snooze.revision;
  });
  if (!ok){ if (stored) photosDB.del(id).catch(() => {}); return; }
  delete ui.galleryCache[plantId];
  if (stored){ toast('📷 Foto guardada'); openPhoto(id); }
  else toast('La foto quedó como portada, pero este navegador no permite guardar la galería.');
}

// Abre una foto (y su diagnóstico, si tiene). Con logId se muestra ese diagnóstico en particular.
async function openPhoto(photoId, logId, keepScroll){
  const token = ++ui.photoToken;
  const top = modalBody.scrollTop;
  let rec = null;
  if (photoId){ try { rec = await photosDB.get(photoId) || null; } catch (e) { console.warn(e); } }
  if (token !== ui.photoToken) return;   // otra pantalla se abrió mientras cargaba
  const p = rec ? getPlant(rec.plantId) : logId ? state.plants.find(x => x.log.some(l => l.id === logId)) : null;
  if (!p) return toast('Esa foto ya no está disponible.');
  const diags = p.log.filter(l => l.type === 'diagnostico' && (logId ? l.id === logId : rec && l.photoId === rec.id));
  const entry = diags[diags.length - 1] || null;
  if (!rec && !entry) return toast('Esa foto ya no está disponible.');
  openModal(photoHTML(p, rec, entry), {kind:'photo', id:p.id, photoId:rec ? rec.id : null, logId:entry ? entry.id : null}, `Foto de ${p.name}`);
  if (keepScroll) modalBody.scrollTop = top;

const fmtUSD = n => n < 0.01 ? 'menos de US$0,01' : 'US$' + n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtDM = new Intl.DateTimeFormat('es-AR', {day:'numeric', month:'short'});
function diagResultHTML(entry, p, hasPhoto){
  const d = entry.data, st = DIAG_STATES[d.estado], e = d.especie, meta = entry.meta || {};
  const li = arr => arr.map(x => `<li>${esc(x)}</li>`).join('');

  if (meta.nota) h += `<p class="diag-note">Tu comentario: “${esc(meta.nota)}”</p>`;

  else if (d.calidad_foto === 'mala') h += '<p class="banner">La foto no es muy clara: probá con más luz y acercándote a las partes afectadas.</p>';

    h += `<div class="sugg"><span>Regar cada <b>${d.riego_sugerido_dias} días</b> en vez de ${p.waterEvery}</span>

  if (d.es_planta && e.catalogo_id !== 'otra' && e.catalogo_id !== p.speciesId && e.confianza !== 'baja')
    h += `<div class="sugg"><span>Parece ser <b>${esc(SPECIES_BY_ID[e.catalogo_id].name)}</b> (confianza ${e.confianza}), no ${esc(speciesOf(p).name.toLowerCase())}</span>
      <button class="linkbtn" type="button" data-action="apply-species" data-id="${p.id}" data-species="${e.catalogo_id}">Cambiar especie →</button></div>`;
  else if (d.es_planta && e.catalogo_id === 'otra' && p.speciesId === 'otra' && e.nombre_comun)
    h += `<div class="sugg"><span>Parece ser <b>${esc(e.nombre_comun)}</b>${e.nombre_cientifico ? ` <i>(${esc(e.nombre_cientifico)})</i>` : ''} · confianza ${e.confianza}</span></div>`;
  if (d.acciones_inmediatas.length) h += `<h4>Qué hacer ahora</h4><ol class="steps-n">${li(d.acciones_inmediatas)}</ol>`;
  if (d.problemas.length) h += '<h4>Problemas probables</h4>' + d.problemas.map(pr => `<div class="problem">
      <div class="problem-head"><strong>${esc(pr.nombre)}</strong><span class="prob ${pr.probabilidad}">Probabilidad ${pr.probabilidad}</span></div>
      ${pr.senales ? `<p><b>Señales:</b> ${esc(pr.senales)}</p>` : ''}
      ${pr.causa ? `<p><b>Causa probable:</b> ${esc(pr.causa)}</p>` : ''}
      ${pr.tratamiento.length ? `<ul class="tips">${li(pr.tratamiento)}</ul>` : ''}
    </div>`).join('');
  if (PROBLEM_STATES.includes(d.estado) && getPlant(p.id)){
    const tr = treatmentForDiag(p, entry);
    h += `<div class="btn-row" style="margin-top:18px">${tr
      ? `<button class="btn" type="button" data-action="treat-open" data-id="${p.id}" data-tid="${esc(tr.id)}">Ver tratamiento (${treatProgress(tr)})</button>`
      : `<button class="btn primary" type="button" data-action="treat-from-diag" data-id="${p.id}" data-log="${esc(entry.id)}">Empezar tratamiento</button>`}</div>`;
  }
  if (d.observaciones.length) h += `<details style="margin-top:14px"><summary>Lo que se ve en la foto</summary><ul class="tips">${li(d.observaciones)}</ul></details>`;
  if (d.consultar_experto) h += '<p class="banner" style="margin-top:14px">Conviene consultar en un vivero: llevá una hoja afectada o mostrales esta foto.</p>';
  const latest = p.log.filter(l => l.type === 'diagnostico').pop();
  const rv = nextReview(p);
  if (latest && latest.id === entry.id && rv) h += `<p class="review-line">Te vamos a recordar sacar otra foto ${whenText(diffDays(todayISO(), rv)).toLowerCase()} para ver cómo evoluciona.</p>`;
  h += `<p class="small muted" style="margin:16px 0 0">Diagnóstico orientativo generado por IA (${esc(modelName(meta.modelo))}): puede equivocarse.${meta.costo != null ? ` Costo aproximado: ${fmtUSD(meta.costo)}.` : ''}</p>`;
  if (hasPhoto) h += '<p style="margin:10px 0 0"><button class="linkbtn" type="button" data-action="diag-again">Volver a diagnosticar</button></p>';
  return h;
}

function addDiagnosisEntry(p, analysis, photoId){
  const d = analysis.diag, t = todayISO();
  const entry = {id:uid(), date:t, type:'diagnostico', text:d.resumen, data:d, meta:{nota:analysis.note || '', modelo:analysis.model, costo:analysis.cost}};
  if (photoId) entry.photoId = photoId;
  p.log.push(entry);
  // Si encontró un problema, programa una foto de control para ver cómo evoluciona.
  p.reviewDue = PROBLEM_STATES.includes(d.estado) ? addDays(t, d.revisar_en_dias || 7) : null;
  delete p.snooze.revision;
  return entry.id;
}
async function runDiagnosis(){
  const m = ui.modal;
  if (!m || m.kind !== 'photo' || !m.photoId || ui.busy) return;
  const {photoId, id:plantId} = m;
  const note = ($('#diag-note')?.value || '').trim().slice(0, 400);
  ui.diagNote = note;
  let rec = null;
  try { rec = await photosDB.get(photoId); } catch (e) { console.warn(e); }
  const p = getPlant(plantId);
  if (!rec || !p) return toast('Esa foto ya no está disponible.');
  $('#diag-area').innerHTML = loadingHTML();
  ui.busy = true;
  let analysis;
  try {
    analysis = await callClaude(rec.full, aiContext(p, note));
  } catch (e) {
    ui.busy = false;
    const area = $('#diag-area');
    if (area && ui.modal && ui.modal.photoId === photoId) area.innerHTML = diagPromptHTML(e.message);
    else toast(e.message);
    return;
  }
  analysis.note = note;
  let logId = null;
  const ok = act(null, () => { const q = getPlant(plantId); if (q) logId = addDiagnosisEntry(q, analysis, photoId); });
  ui.busy = false;
  ui.diagNote = '';
  if (!ok || !logId) return;
  if (ui.modal && ui.modal.kind === 'photo' && ui.modal.photoId === photoId) openPhoto(photoId, logId);
  else toast(`🩺 Diagnóstico de ${p.name}: ${DIAG_STATES[analysis.diag.estado].label.toLowerCase()}`);
}

/* ---------- Llamada a la función de diagnóstico (Netlify) ---------- */
function getModel(){ let m = null; try { m = localStorage.getItem(MODEL_STORAGE); } catch {} return AI_MODELS[m] ? m : DEFAULT_MODEL; }
function setModel(m){ if (AI_MODELS[m]) try { localStorage.setItem(MODEL_STORAGE, m); } catch {} }

// Datos de la planta para la IA. El servidor los valida y arma el texto del pedido.
function aiContext(p, note){
  const t = todayISO();
  const c = {hoy:t, estacion:SEASONS[seasonKey()].name.toLowerCase(), hemisferio:state.settings.hemisphere === 'N' ? 'norte' : 'sur', nota:note || ''};
  if (!p) return {...c, planta_nueva:true};
  const sp = speciesOf(p);
  const historial = p.log.filter(l => l.type !== 'alta' && l.type !== 'foto').slice().sort((a, b) => a.date.localeCompare(b.date)).slice(-10)
    .map(l => `${l.date}: ${LOG_TYPES[l.type].label}${l.type === 'diagnostico' ? ` (${l.data.estado})` : ''}${l.text ? ` — ${l.text}` : ''}`);
  return {
    ...c,
    nombre: p.name,
    especie: sp.id === 'otra' ? '' : `${sp.name} (${sp.sci})`,
    ubicacion: p.location,
    riego_cada_dias: waterInterval(p),
    ultimo_riego: p.lastWater,
    dias_desde_riego: p.lastWater ? diffDays(p.lastWater, t) : null,
    abono_cada_dias: p.fertEvery,
    ultimo_abono: p.lastFert,
    historial,
    notas: p.notes,
  };
}
function costOf(model, usage){
  const info = MODEL_INFO[model];
  if (!info || !usage) return null;
  return ((usage.input_tokens || 0) * info[1] + (usage.output_tokens || 0) * info[2]) / 1e6;
}
async function callClaude(imageDataURL, contexto){
  if (!servedOnline()) throw new Error('El diagnóstico con IA funciona en la app publicada en Netlify, no abriendo el archivo directamente.');
  const img = /^data:(image\/(?:jpeg|png|webp));base64,(.+)$/.exec(imageDataURL || '');
  if (!img) throw new Error('La foto no tiene un formato válido.');
  const headers = {'Content-Type':'application/json'};
  if (APP_TOKEN) headers['x-app-token'] = APP_TOKEN;
  let res;
  try {
    res = await fetch(DIAG_URL, {method:'POST', headers, body:JSON.stringify({photo:{mediaType:img[1], data:img[2]}, contexto, modelo:getModel()})});
  } catch { throw new Error('No hay conexión. Revisá tu internet y probá de nuevo.'); }
  const data = await res.json().catch(() => null);
  if (!res.ok || !data){
    if (data && data.error) throw new Error(data.error);
    if (res.status === 404) throw new Error('No se encontró el servicio de diagnóstico. ¿Está publicada la función en Netlify?');
    if (res.status === 502 || res.status === 504) throw new Error('El diagnóstico tardó demasiado. Probá de nuevo o elegí un modelo más rápido en Ajustes.');
    throw new Error(`No se pudo hacer el diagnóstico (error ${res.status}). Probá de nuevo.`);
  }
  const served = data.modelo || getModel(), cost = costOf(served, data.uso);
  recordUsage(cost);   // se anota aunque la respuesta no se pueda leer: Claude la cobra igual
  const diag = normalizeDiag(data.resultado);
  if (!diag) throw new Error('No se pudo leer la respuesta de la IA. Probá de nuevo.');
  return {diag, model:served, cost};
}
const monthKey = (offset = 0) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + offset); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
function recordUsage(cost){
  commit(() => {
    const m = state.aiUsage[monthKey()] ||= {n:0, c:0};
    m.n++;
    if (cost > 0) m.c += cost;
  });
}

// Ordena los problemas según los síntomas marcados y, si se eligió una planta, según su riego.
function rankProblems(selected, p){
  const t = todayISO();
  return PROBLEMS.map(pr => {
    const hits = selected.filter(k => pr.sym[k]);
    if (!hits.length) return null;
    let score = hits.reduce((n, k) => n + pr.sym[k], 0), why = '';
    if (p){
      const sp = speciesOf(p);
      const often = sp.id !== 'otra' && p.waterEvery < sp.riego * 0.75;
      if (['exceso-riego', 'pudricion-raiz', 'mosquita-sustrato'].includes(pr.id) && often){
        score += 2;
        why = `Dato de tu planta: la regás cada ${p.waterEvery} días y para ${sp.name.toLowerCase()} se recomienda cada ~${sp.riego}.`;
      }
      if (pr.id === 'falta-riego' && p.lastWater){
        const since = diffDays(p.lastWater, t), every = waterInterval(p);
        if (since > every + 2){ score += 2; why = `Dato de tu planta: hace ${since} días que no la regás (le toca cada ${every}).`; }
        else if (sp.id !== 'otra' && p.waterEvery > sp.riego * 1.5){ score += 1; why = `Dato de tu planta: la regás cada ${p.waterEvery} días y para ${sp.name.toLowerCase()} se recomienda cada ~${sp.riego}.`; }
      }
      if (pr.id === 'aire-seco' && ['calathea', 'helecho', 'areca', 'espatifilo', 'orquidea'].includes(sp.id)){
        score += 1;

      }
    }
    return {pr, score, hits, why, typical:hits.some(k => pr.sym[k] === 3)};
  }).filter(Boolean).sort((a, b) => b.score - a.score || b.hits.length - a.hits.length).slice(0, 4);
}

function openTreatment(plantId, tid){

function startTreatment(plantId, problemId, origin){
  const p0 = getPlant(plantId), pr = PROBLEM_BY_ID[problemId];
  if (!p0 || !pr) return;
  const existing = activeTreatments(p0).find(t => t.problemId === problemId);
  if (existing){ openTreatment(plantId, existing.id); toast('Ya estaba en tratamiento: seguí con estos pasos.'); return; }
  const tid = uid(), t = todayISO();
  const ok = act(`🩹 ${p0.name}: tratamiento para ${pr.name.toLowerCase()}`, () => {
    const p = getPlant(plantId);
    (p.treatments ||= []).push({id:tid, title:pr.name, problemId, origin:['sintomas', 'guia'].includes(origin) ? origin : 'guia', diagLogId:null,
      createdAt:t, status:'activo', resolvedAt:null, steps:pr.steps.map(text => ({text, done:false}))});
    p.log.push({id:uid(), date:t, type:'tratamiento', text:`Empezó: ${pr.name}`});
    if (!p.reviewDue) p.reviewDue = addDays(t, 7);
  });
  if (ok) openTreatment(plantId, tid);
}
function matchProblem(text){
  const s = (text || '').toLowerCase();
  return PROBLEM_MATCH_ORDER.find(id => PROBLEM_BY_ID[id].kw.some(k => s.includes(k))) || null;
}
const diagProblemId = d => matchProblem([d.problemas[0] && d.problemas[0].nombre, d.problemas[0] && d.problemas[0].causa, d.resumen].filter(Boolean).join(' '));
function treatmentForDiag(p, entry){
  const pid = diagProblemId(entry.data);
  return (p.treatments || []).find(t => t.diagLogId === entry.id) || (pid && activeTreatments(p).find(t => t.problemId === pid)) || null;
}
function treatFromDiag(plantId, logId){
  const p0 = getPlant(plantId), entry = p0 && p0.log.find(l => l.id === logId);
  if (!entry || !entry.data) return;
  const already = treatmentForDiag(p0, entry);
  if (already) return openTreatment(plantId, already.id);
  const d = entry.data, top = d.problemas[0];
  const seen = new Set(), steps = [];
  for (const text of [...d.acciones_inmediatas, ...(top ? top.tratamiento : [])]){
    const k = text.toLowerCase().trim();
    if (k && !seen.has(k)){ seen.add(k); steps.push({text, done:false}); }
  }
  if (!steps.length) steps.push({text:'Seguí las indicaciones del diagnóstico y sacale otra foto en unos días.', done:false});
  const title = (top ? top.nombre : 'Plan de cuidado').slice(0, 120);
  const problemId = diagProblemId(d);
  const tid = uid(), t = todayISO();
  const ok = act(`🩹 ${p0.name}: tratamiento iniciado`, () => {
    const p = getPlant(plantId);
    (p.treatments ||= []).push({id:tid, title, problemId, origin:'ia', diagLogId:logId, createdAt:t, status:'activo', resolvedAt:null, steps:steps.slice(0, 12)});
    p.log.push({id:uid(), date:t, type:'tratamiento', text:`Empezó: ${title}`});
    if (!p.reviewDue) p.reviewDue = addDays(t, d.revisar_en_dias || 7);
  });
  if (ok) openTreatment(plantId, tid);
}
function toggleStep(plantId, tid, i){
  if (commit(() => { const s = findTreatment(getPlant(plantId), tid).steps[i]; s.done = !s.done; }) === null) return;
  refresh();
  const t = findTreatment(getPlant(plantId), tid);
  if (t.status === 'activo' && t.steps.every(s => s.done)) toast('¡Hiciste todos los pasos! Cuando la veas bien, marcala como curada.');
}
function resolveTreatment(plantId, tid){
  const p0 = getPlant(plantId);
  if (!findTreatment(p0, tid)) return;
  act(`🌿 ¡${p0.name} se curó!`, () => {
    const p = getPlant(plantId), t = findTreatment(p, tid), d = todayISO();
    t.status = 'resuelto';
    t.resolvedAt = d;
    p.log.push({id:uid(), date:d, type:'tratamiento', text:`Curada: ${t.title}`});
    if (!activeTreatments(p).length){ p.reviewDue = null; delete p.snooze.revision; }
  });
}
function deleteTreatment(plantId, tid){
  const p0 = getPlant(plantId), t0 = findTreatment(p0, tid);
  if (!t0 || !confirm(`¿Quitar el tratamiento «${t0.title}»?`)) return;
  openDetail(plantId);
  act('Tratamiento quitado', () => { const p = getPlant(plantId); p.treatments = p.treatments.filter(t => t.id !== tid); });
}

/* ---------- Exportar / importar ---------- */
function download(filename, content, mime){
  const url = URL.createObjectURL(new Blob([content], {type:mime}));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const icsEscape = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const encoder = new TextEncoder();
function icsFold(line){
  // RFC 5545: líneas de hasta 75 octetos; las continuaciones empiezan con un espacio.
  const out = []; let cur = '', bytes = 0;
  for (const ch of line){
    const b = encoder.encode(ch).length;
    if (bytes + b > 74){ out.push(cur); cur = ' ' + ch; bytes = 1 + b; }
    else { cur += ch; bytes += b; }
  }
  out.push(cur);
  return out.join('\r\n');
}
function buildICS(){
  const t = todayISO();
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const compact = s => s.replace(/-/g, '');
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Brote//Cuidado de plantas//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Brote · Plantas'];
  const event = (uidStr, start, interval, summary, desc) => lines.push(
    'BEGIN:VEVENT', `UID:${uidStr}`, `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${compact(start)}`, `DTEND;VALUE=DATE:${compact(addDays(start, 1))}`,
    `RRULE:FREQ=DAILY;INTERVAL=${interval}`, `SUMMARY:${icsEscape(summary)}`, `DESCRIPTION:${icsEscape(desc)}`,
    'TRANSP:TRANSPARENT', 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(summary)}`, 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
  for (const p of state.plants){
    const sp = speciesOf(p), where = p.location ? ` (${p.location})` : '';
    event(`riego-${p.id}@brote`, maxISO(nextWater(p), t), waterInterval(p), `💧 Regar ${p.name}${where}`,
      `${sp.name}. ${sp.riegoNota} Antes de regar, tocá la tierra.`);
    const f = nextFert(p);
    if (f) event(`abono-${p.id}@brote`, maxISO(f, t), p.fertEvery, `🧪 Abonar ${p.name}${where}`,
      `${sp.name}. Abono cada ${p.fertEvery} días durante la temporada de crecimiento.`);
  }
  lines.push('END:VCALENDAR');
  return lines.map(icsFold).join('\r\n') + '\r\n';
}
const DATA_IMG = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
function validPhotoRecord(f, plantIds){
  return !!f && typeof f === 'object' && typeof f.id === 'string' && f.id.length > 0 && f.id.length <= 40 &&
    plantIds.has(f.plantId) && isValidISO(f.date) && Number.isFinite(f.createdAt) &&
    typeof f.thumb === 'string' && DATA_IMG.test(f.thumb) && typeof f.full === 'string' && DATA_IMG.test(f.full);
}
async function exportBackup(){
  let fotos = [];
  try {
    const ids = new Set(state.plants.map(p => p.id));
    fotos = (await photosDB.all()).filter(r => ids.has(r.plantId));
  } catch (e) { console.warn(e); }
  download(`brote-respaldo-${todayISO()}.json`, JSON.stringify({...state, fotos}), 'application/json');
  toast(`⬇️ Respaldo descargado${fotos.length ? ` (con ${fotos.length} ${plural(fotos.length, 'foto', 'fotos')})` : ''}`);
}
async function importFile(file){
  try {
    if (file.size > 300 * 1024 * 1024) throw new Error('El archivo es demasiado grande.');
    const raw = JSON.parse(await file.text());
    const data = normalizeState(raw);
    const ids = new Set(data.plants.map(p => p.id));
    const fotos = Array.isArray(raw.fotos) ? raw.fotos.filter(f => validPhotoRecord(f, ids)) : [];
    const n = data.plants.length;
    const extra = fotos.length ? ` y ${fotos.length} ${plural(fotos.length, 'foto', 'fotos')}` : '';
    const msg = state.plants.length
      ? `Esto reemplaza tus ${state.plants.length} plantas actuales por las ${n} del respaldo${extra}. ¿Continuar?`
      : `Se van a importar ${n} ${plural(n, 'planta', 'plantas')}${extra}. ¿Continuar?`;
    if (!confirm(msg)) return;
    let failed = 0;
    for (const f of fotos){
      try { await photosDB.put({id:f.id, plantId:f.plantId, date:f.date, createdAt:f.createdAt, thumb:f.thumb, full:f.full}); }
      catch { failed++; }
    }
    ui.galleryCache = {};
    act(`⬆️ Respaldo importado: ${n} ${plural(n, 'planta', 'plantas')}${extra}`, () => { state = data; });
    scheduleGC();
    if (failed) setTimeout(() => toast(`No se pudieron guardar ${failed} fotos en este navegador.`), 1500);
  } catch (e) {
    toast(e instanceof SyntaxError ? 'El archivo no es un JSON válido.' : e.message);
  }
}
